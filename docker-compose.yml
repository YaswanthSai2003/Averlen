services:
  api:
    build: .
    container_name: pricepilot-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16
    container_name: pricepilot-postgres
    environment:
      POSTGRES_USER: pricepilot
      POSTGRES_PASSWORD: pricepilot
      POSTGRES_DB: pricepilot
    ports:
      - "5433:5432"
    volumes:
      - pricepilot_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: pricepilot-redis
    ports:
      - "6379:6379"

volumes:
  pricepilot_postgres_data: