name: PricePilot CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: sqlite:///./test_pricepilot.db
      REDIS_URL: redis://localhost:6379/0
      OPENAI_API_KEY: ""
      OPENAI_MODEL: stepfun/step-3.5-flash:free
      SITE_URL: http://localhost:8000
      SITE_NAME: PricePilot

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest
