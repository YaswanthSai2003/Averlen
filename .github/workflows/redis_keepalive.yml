name: Averlen Redis Keepalive

on:
  schedule:
    - cron: "17 3 * * 1"

  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping Averlen Redis
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 2 \
            --retry-delay 10 \
            --max-time 180 \
            -H "X-Keepalive-Token: ${{ secrets.KEEPALIVE_TOKEN }}" \
            "${{ vars.AVERLEN_BACKEND_URL }}/keepalive/redis"
